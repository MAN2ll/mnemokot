[versions]
agp = "8.4.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
hilt = "2.51.1"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.2"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
room = "2.6.1"
sqlcipher = "4.5.4"
sqliteKtx = "2.4.0"
workManager = "2.9.0"
crypto = "1.1.0-alpha06"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Room & SQLCipher (Шифрование базы данных)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", ref = "room" }
sqlcipher = { group = "net.zetetic", name = "android-database-sqlcipher", ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", ref = "sqliteKtx" }

# Dependency Injection (Hilt)
google-hilt-android = { group = "com.google.dagger", name = "hilt-android", ref = "hilt" }
google-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", value = "1.2.0" }

# WorkManager (Фоновые задачи аудита)
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", ref = "workManager" }

# Crypto (Безопасное хранилище и Keystore)
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", ref = "crypto" }

[plugins]
android-application = { id = "com.android.application", ref = "agp" }
android-library = { id = "com.android.library", ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", ref = "hilt" }
