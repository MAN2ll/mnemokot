name: Android CI

on:
 # push:
 #   branches: [ "main" ]
 # pull_request:
 #   branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ИСПРАВЛЕНИЕ: Миграция на актуальную и безопасную версию setup-java@v5
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # Встроенное кэширование новой версии v5 для исправления ошибок 400

    - name: Setup Gradle Build Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Missing Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Change wrapper permissions
      run: chmod +x gradlew

    - name: Build App with Gradle Wrapper
      run: ./gradlew assembleDebug

    - name: Run Cryptography Unit Tests
      run: ./gradlew test

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mnemokot-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
