name: Android CI # Общее название во вкладке Actions

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Выберите тип сборки (Поток)'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Динамически меняем имя запущенного процесса в истории
    name: Build Run (${{ inputs.build_type }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
 
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' 

    - name: Setup Gradle Build Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Missing Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Change wrapper permissions
      run: chmod +x gradlew

    - name: Build App with Gradle Wrapper
      run: ./gradlew assembleDebug

    - name: Run Cryptography Unit Tests
      run: ./gradlew test

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        # Название архива будет зависеть от выбранного вами режима
        name: mnemokot-${{ inputs.build_type }}-apk
        path: app/build/outputs/apk/debug/app-debug.apk
