name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Сначала настраиваем встроенную консольную утилиту Gradle
    - name: Setup Gradle Build Action
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    # 2. Генерируем недостающий файл gradlew в корень проекта, используя версию 8.6
    - name: Generate Missing Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    # 3. Даем права на исполнение только что созданному локальному файлу
    - name: Change wrapper permissions
      run: chmod +x gradlew

    # 4. Запускаем чистую сборку нашего приложения через локальную обертку
    - name: Build App with Gradle Wrapper
      run: ./gradlew assembleDebug

    # 5. Запускаем Unit-тесты для модуля криптографии
    - name: Run Cryptography Unit Tests
      run: ./gradlew test
