name: Android CI with Debug Logs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest # Для запуска эмулятора Android на GitHub требуется виртуальная машина macOS с аппаратным ускорением

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Missing Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Change wrapper permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # ЗАПУСК ЭМУЛЯТОРА ДЛЯ СБОРА РЕАЛЬНЫХ ЛОГОВ ПАДЕНИЯ
    - name: Run Emulator and Collect Logs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 27 # Android 8.1 (Именно ваша проблемная версия)
        target: default
        arch: x86_64
        script: |
          # Пытаемся установить приложение на устройство
          adb install -r app/build/outputs/apk/debug/app-debug.apk || echo "INSTALL_FAILED" > install_error.txt
          
          # Захватываем первые 500 строк логов краша системы
          adb logcat -d -v time *:E > android_debug_log.txt

    # ВЫГРУЗКА ГОТОВОГО APK И ТЕКСТОВОГО ФАЙЛА ЛОГОВ НА GITHUB
    - name: Upload APK and Logs Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mnemokot-debug-package
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          android_debug_log.txt
          install_error.txt
